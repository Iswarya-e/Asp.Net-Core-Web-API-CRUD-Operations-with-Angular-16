name: Build and Push MFE & MS Docker Images

on:
  push:
    branches: [ devops ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push MFE
        uses: docker/build-push-action@v4
        with:
          context: ../../PaymentAPI
          file: ../../PaymentAPI/Dockerfile
          push: true
          platforms: linux/amd64
          tags: <dockerhub-username>/paymentapi:latest

      - name: Build & Push MS
        uses: docker/build-push-action@v4
        with:
          context: ../../PaymentApp
          file: ../../PaymentApp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: <dockerhub-username>/paymentmfe:latest
